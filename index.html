<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shakil Analyzer</title>
<style>
body{background:#0a0a0a;color:#e8e8e8;font-family:Tahoma;padding:15px;margin:0}
h2{color:#d4af37;text-align:center;font-size:16px}
.card{background:#141414;border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:12px}
button{width:100%;padding:12px;background:#d4af37;color:#000;border:0;border-radius:6px;font-weight:bold;font-size:14px;margin-bottom:8px}
button:disabled{opacity:0.5}
.sig{border-right:4px solid #666;background:#1a1a1a;padding:10px;margin-bottom:8px;border-radius:5px;font-size:12px}
.sig.L{border-color:#00c853;color:#00c853}
.sig.S{border-color:#ff1744;color:#ff1744}
.sig.SL{border-color:#00bcd4;color:#00bcd4}
.sig.SS{border-color:#ffc107;color:#ffc107}
.whale{display:flex;justify-content:space-between;border-bottom:1px solid #333;padding:6px 0;font-size:12px}
</style>
</head>
<body>
<h2>Shakil Trade Analyzer</h2>

<div class="card">
  <div style="color:#d4af37;margin-bottom:8px">🔍 اسکنر (حساسیت کم)</div>
  <button id="btnScan" onclick="scan()">شروع اسکن</button>
  <div id="status" style="font-size:11px;color:#888;text-align:center">آماده</div>
  <div id="results"></div>
</div>

<div class="card">
  <div style="color:#d4af37;margin-bottom:8px">🐋 سفارشات سنگین (BTC)</div>
  <button onclick="whales()">رصد ۱۰ ثانیه‌ای</button>
  <div id="whales" style="margin-top:8px"></div>
</div>

<script>
// اتصال مستقیم به MEXC بدون کلودفلر (چون فیلترشکن روشن است)
const API = 'https://contract.mexc.com/api/v1';
let allSymbols = [];

async function scan() {
  const btn = document.getElementById('btnScan');
  const status = document.getElementById('status');
  const resBox = document.getElementById('results');
  btn.disabled = true; status.innerText = 'در حال دریافت لیست...'; resBox.innerHTML = '';

  try {
    const r = await fetch(API + '/contract/detail');
    const j = await r.json();
    let list = j.data || [];
    if (!Array.isArray(list)) list = Object.values(list);
    allSymbols = list.filter(c => c.symbol && c.symbol.endsWith('USDT')).slice(0, 20);

    if (allSymbols.length === 0) {
      status.innerText = 'خطا: لیست ارزها خالی است (فیلترشکن را عوض کنید)';
      btn.disabled = false; return;
    }

    status.innerText = 'در حال تحلیل ' + allSymbols.length + ' ارز...';
    let signals = [];

    for (let i = 0; i < allSymbols.length; i++) {
      let sym = allSymbols[i].symbol;
      try {
        // دریافت کندل ۱ ساعته
        let k1 = await fetch(API + '/contract/kline/' + sym + '?interval=Min60').then(x => x.json());
        if (!k1.data || !k1.data.close) continue;

        let closes = k1.data.close.map(Number);
        let last = closes.length - 1;
        let rsi = calcRSI(closes);
        let ema20 = calcEMA(closes, 20);
        let ema50 = calcEMA(closes, 50);

        // منطق بسیار ساده: فقط جهت روند و RSI
        let score = 0;
        let type = 'WAIT';

        if (closes[last] > ema20[last] && ema20[last] > ema50[last]) { score += 40; type = 'LONG'; }
        else if (closes[last] < ema20[last] && ema20[last] < ema50[last]) { score += 40; type = 'SHORT'; }

        if (type === 'LONG' && rsi > 50) score += 10;
        if (type === 'SHORT' && rsi < 50) score += 10;

        // حساسیت پایین: امتیاز بالای ۴۰ قبول می‌شود
        if (score >= 40) {
          signals.push({ sym: sym, type: type, score: score, price: closes[last] });
        }
      } catch (e) { }
      status.innerText = 'تحلیل: ' + (i+1) + ' از ' + allSymbols.length;
    }

    if (signals.length === 0) {
      resBox.innerHTML = '<div style="text-align:center;color:#888;margin-top:10px">سیگنالی پیدا نشد</div>';
    } else {
      resBox.innerHTML = signals.map(s => `
        <div class="sig ${s.type==='LONG'?'L':'S'}">
          <b>${s.sym}</b> - ${s.type}<br>
          قیمت: ${s.price} | امتیاز: ${s.score}
        </div>`).join('');
    }
    status.innerText = 'پایان اسکن. ' + signals.length + ' سیگنال.';
  } catch (e) {
    status.innerText = 'خطای شبکه: ' + e.message;
  }
  btn.disabled = false;
}

function calcEMA(arr, len) {
  let k = 2 / (len + 1), ema = arr[0];
  let out = arr.map(v => { ema = v * k + ema * (1 - k); return ema; });
  return out;
}

function calcRSI(arr) {
  let gains = 0, losses = 0;
  for (let i = arr.length - 14; i < arr.length; i++) {
    let diff = arr[i] - arr[i - 1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  if (losses === 0) return 100;
  let rs = (gains / 14) / (losses / 14);
  return 100 - (100 / (1 + rs));
}

// سفارشات سنگین
let wInterval = null;
async function whales() {
  if (wInterval) { clearInterval(wInterval); wInterval = null; return; }
  const box = document.getElementById('whales');
  box.innerHTML = 'در حال رصد...';
  
  const fetchW = async () => {
    try {
      let r = await fetch(API + '/contract/depth/BTC_USDT').then(x => x.json());
      if (r.data && r.data.bids) {
        let html = '';
        let check = (arr, side) => {
          if(!arr) return;
          arr.forEach(l => {
            let vol = parseFloat(l[0]) * parseFloat(l[1]);
            if (vol > 10000) { // سفارشات بالای ۱۰ هزار دلار
              html += `<div class="whale"><span style="color:${side==='B'?'#00c853':'#ff1744'}">${side==='B'?'خرید':'فروش'}</span><span>${l[0]}</span><b>${Math.round(vol)}$</b></div>`;
            }
          });
        };
        check(r.data.bids, 'B');
        check(r.data.asks, 'S');
        if(html) box.innerHTML = html;
      }
    } catch(e) {}
  };
  fetchW();
  wInterval = setInterval(fetchW, 5000);
}
</script>
</body>
</html>
