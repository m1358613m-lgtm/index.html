<!DOCTYPE html>
<html dir="rtl">
<body style="background:#111;color:#fff;font-family:Tahoma;padding:20px">
<h2>تست اتصال به MEXC</h2>
<button onclick="test()" style="padding:15px;font-size:18px;background:#d4af37;color:#000;border:none;border-radius:8px">تست کن</button>
<p id="res" style="margin-top:20px;font-size:14px;word-break:break-all;line-height:1.6">نتیجه اینجا نمایش داده می‌شود...</p>
<script>
async function test(){
  document.getElementById('res').innerText = 'در حال تست...';
  try {
    const res = await fetch('https://shakil.m1358613m.workers.dev/api/v1/contract/detail');
    const json = await res.json();
    let list = json.data || [];
    if (!Array.isArray(list)) list = Object.values(list);
    const usdt = list.filter(c => c.symbol && c.symbol.endsWith('USDT'));
    document.getElementById('res').innerText = 'موفق! تعداد کل: ' + list.length + ' - تعداد USDT: ' + usdt.length + ' - اولین نماد: ' + (usdt[0] ? usdt[0].symbol : 'هیچ');
  } catch(e) {
    document.getElementById('res').innerText = 'خطای شبکه: ' + e.message;
  }
}
</script>
</body>
</html>
